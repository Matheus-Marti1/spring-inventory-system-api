spring:
  datasource:
    # --- Configuração para PostgreSQL ---
    #url: jdbc:postgresql://localhost:5432/sistestoque?createDatabaseIfNotExist=true
    #username: seu_usuario
    #password: sua_senha
    #driver-class-name: org.postgresql.Driver

    # --- Configuração para MariaDB/MySQL ---
    url: jdbc:mariadb://localhost:3306/sistestoque?createDatabaseIfNotExist=true
    username: seu_usuario
    password: sua_senha
    driver-class-name: org.mariadb.jdbc.Driver
    # Para usar MySQL puro, trocar o driver-class-name para com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://localhost:3306/sistestoque?createDatabaseIfNotExist=true
    #driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        #Para Postgre: org.hibernate.dialect.PostgreSQLDialect
        # Para MySQL: org.hibernate.dialect.MySQL8Dialect
        dialect: org.hibernate.dialect.MariaDBDialect
        show_sql: true
        format_sql: true
